<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Popup Love Message</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      overflow: hidden;
      height: 100vh;
      cursor: pointer;
    }

    .popup {
      position: absolute;
      padding: 10px 16px;
      background-color: rgba(255, 182, 193, 0.18);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #ff4da6; /* chữ hồng */
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(255,182,193,0.6);
      pointer-events: none;
      user-select: none;
      animation: floatFade 5s ease forwards;
      white-space: nowrap;
    }

    @keyframes floatFade {
      0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translateY(-120px) scale(0.6) rotate(15deg); }
    }

    .dialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      background-color: #F8C7DA;
      padding: 20px;
      border-radius: 10px;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      font-size: 24px;
      color: white;
      text-align: center;
      box-shadow: 0 0 15px pink;
      z-index: 1000;
      max-width: 80%;
      box-sizing: border-box;
    }

    @media screen and (max-width:600px) {
      .popup { font-size:14px; padding:8px 12px; max-width:160px; }
      .dialog { font-size:18px; padding:15px; }
    }
  </style>
</head>
<body>
  <div id="startDialog" class="dialog">💗 Click vào màn hình nhaaa! 💗</div>
  <audio id="backgroundMusic" src="assets/music.mp3" loop></audio>

  <script>
    // 24 tên (đã đúng cú pháp)
    const messages = [
      "Huỳnh Ngọc Minh Anh", "Ông Kim Lan Anh", "Kiều Thị Hồng Ân", "Tống Nguyễn Bảo Hân",
      "Phạm Kiều Mỹ Kỳ", "Lê Trần Thùy Lan", "Trương Thị Thùy Linh", "Lê Xuân Mai",
      "Trần Võ Như Mơ", "Nguyễn Kiều Gia Mỹ", "Nguyễn Thị Huỳnh Như", "Nguyễn Ngọc Nam Phương",
      "Huỳnh Băng Tâm", "Trần Dạ Thảo", "Võ Ngọc Phương Thùy", "Đỗ Thị Cẩm Tiên",
      "Nguyễn Thị Tuyết Trân", "Trần Thị Huyền Trân", "Nguyễn Lê Nhã Trúc", "Nguyễn Thanh Trúc",
      "Nguyễn Thị Thanh Trúc", "Nguyễn Huỳnh Triệu Tuyền", "Đặng Nguyễn Nhật Vy", "Phan Thị Kiều Vy"
    ];

    const dialog = document.getElementById("startDialog");
    const audio = document.getElementById("backgroundMusic");

    // Tạo 1 popup (với text dạng "I miss you, [Tên] 💕" nếu muốn)
    function createPopup() {
      const popup = document.createElement("div");
      popup.className = "popup";

      // Thay đổi chuỗi hiển thị ở đây nếu muốn
      const name = messages[Math.floor(Math.random() * messages.length)];
      popup.textContent = `I miss you, ${name} 💕`;

      // đặt vị trí an toàn để popup không bị cắt khỏi viewport
      const pw = 220; // ước tính width max popup (px)
      const ph = 40;  // ước tính height
      const left = Math.random() * Math.max(0, window.innerWidth - pw);
      const top = Math.random() * Math.max(0, window.innerHeight - ph);
      popup.style.left = `${left}px`;
      popup.style.top = `${top}px`;

      document.body.appendChild(popup);

      // tự xóa sau animation kết thúc (thời gian 5s)
      setTimeout(() => {
        popup.remove();
      }, 5200);
    }

    // Hiển thị 'count' lần popup (1 lần duy nhất khi bắt đầu)
    function startPopups(count) {
      let created = 0;
      const interval = setInterval(() => {
        if (created >= count) {
          clearInterval(interval);
          return;
        }
        createPopup();
        created++;
      }, 40); // khoảng cách giữa mỗi popup (ms)
    }

    // full-screen cross-browser
    function enterFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen();
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
    }

    // Bắt sự kiện click 1 lần để start trải nghiệm
    function startExperience() {
      dialog.style.display = "none";
      audio.play().catch(err => console.log("Không phát được nhạc:", err));
      enterFullscreen();
      startPopups(200); // Em muốn 200 popup
      // ngắt listener để không bật lại
      document.removeEventListener("click", startExperience);
    }

    // Lắng nghe click (1 lần)
    document.addEventListener("click", startExperience);
  </script>
</body>
</html>
